<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500&display=swap">
<style>
html,body{margin:0;height:100%;background:var(--bg,#08090a)}
.wrap{position:relative;width:960px;height:300px;overflow:hidden;background:var(--bg,#08090a)}
svg{position:absolute;left:0;top:0}
.green{fill:var(--green,#009a44)} .panel{fill:var(--panel-solid,#0f1011)} .red{fill:var(--red,#E10600)} .gold{fill:var(--gold,#f0bf00)} .ink{fill:var(--text,#f7f8f8)}
.line{fill:none;stroke:var(--border-strong,rgba(255,255,255,.14));stroke-width:2}
.tile{rx:var(--radius-lg,12px)}
.name{position:absolute;left:40px;bottom:58px;width:440px;font:400 88px/.95 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--text,#f7f8f8);margin:0}
.tag{position:absolute;left:40px;bottom:30px;width:440px;font:500 13px/1.4 Montserrat,system-ui,sans-serif;color:var(--text-3,#8a8f98);margin:0}
</style></head><body><div class="wrap">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: green (brand action) 216x300 bleeding top/bottom, panel-solid slab 168x220, white ink tile 72x72, red 48x48, gold 24x24; radius-lg on tiles
     arrangement: one tall green slab with satellites, right of x=480
     pattern: literal motif (topographic contour) -> 5 concentric rounded contour rings from the radius scale, hairline border-strong, across the slab
     steps/radii: space-4 16, space-6 24, radius-lg 12 -->
<rect class="green" x="600" y="-12" width="216" height="324" rx="0"/>
<rect class="panel tile" x="504" y="40" width="168" height="220"/>
<rect class="ink tile" x="840" y="40" width="72" height="72"/>
<rect class="red tile" x="864" y="136" width="48" height="48"/>
<rect class="gold" x="888" y="208" width="24" height="24" rx="6"/>
<g transform="translate(708 150)">
<ellipse class="line" rx="40" ry="28"/><ellipse class="line" rx="76" ry="56"/><ellipse class="line" rx="112" ry="86"/><ellipse class="line" rx="150" ry="118"/><ellipse class="line" rx="190" ry="150"/>
</g>
</svg>
<h1 class="name">Cigala Cycling</h1>
<p class="tag">Coaching, bike tours and retail: one dark, contour-lined look.</p>
</div></body></html>
