<div id="nl-pop" hidden>
  <div class="nl-back" data-nl-close></div>
  <div class="nl-box" role="dialog" aria-modal="true" aria-labelledby="nl-pop-t" tabindex="-1">
    <button type="button" class="nl-x" data-nl-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <p class="nl-eyebrow">Newsletter</p>
    <p class="nl-t" id="nl-pop-t">Stay in the loop</p>
    <p class="nl-d">Training tips, news, blogs and deals on coaching, bike tours and our shop.</p>
    <form class="nl-form" novalidate>
      <label class="nl-sr" for="nl-email-pop">Email address</label>
      <div class="nl-row"><input id="nl-email-pop" type="email" name="EMAIL" required autocomplete="email" inputmode="email" placeholder="Your email address"><button type="submit">Subscribe</button></div>
      <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" class="nl-hp" aria-hidden="true">
      <p class="nl-msg" role="status" aria-live="polite"></p>
      <p class="nl-note">One Cigala Cycling newsletter for all our websites. No spam, unsubscribe anytime. <a href="/privacy-policy/">Privacy policy</a></p>
    </form>
  </div>
</div>
<style>
.nl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nl-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
.nl-eyebrow{margin:0 0 10px;font:600 12px/1.2 Montserrat,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ff3d33}
.nl-t{margin:0;font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;color:#f7f8f8;font-size:clamp(28px,3.2vw,38px);line-height:1.08;letter-spacing:.01em}
.nl-d{margin:12px 0 0;color:#d0d6e0;font:15px/1.55 Montserrat,system-ui,sans-serif;max-width:46ch}
.nl-form{margin:0;font-family:Montserrat,system-ui,sans-serif}
.nl-row{display:flex;gap:10px}
.nl-form input[type=email]{flex:1 1 auto;min-width:0;height:48px;box-sizing:border-box;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#f7f8f8;font:16px Montserrat,system-ui,sans-serif}
.nl-form input[type=email]::placeholder{color:#8a8f98}
.nl-form input[type=email]:focus{outline:none;border-color:#009a44;box-shadow:0 0 0 3px rgba(0,154,68,.25)}
.nl-form input[aria-invalid=true]{border-color:#ff3d33}
.nl-form button[type=submit]{flex:0 0 auto;height:48px;padding:0 22px;border:0;border-radius:8px;background:#009a44;color:#fff;font:600 14px Montserrat,system-ui,sans-serif;letter-spacing:.02em;cursor:pointer}
.nl-form button[type=submit]:hover{background:#00b350}
.nl-form button[type=submit]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nl-form button[disabled]{opacity:.6;cursor:default}
.nl-msg{margin:10px 0 0;font-size:14px;font-weight:600;min-height:0}
.nl-msg:empty{display:none}
.nl-msg.ok{color:#34c46a} .nl-msg.err{color:#ff3d33}
.nl-note{margin:10px 0 0;font-size:12.5px;color:#8a8f98}
.nl-note a{color:#d0d6e0;text-underline-offset:3px}
.nl-form.done .nl-row,.nl-form.done .nl-note{display:none}
.nl-form.done .nl-msg{margin-top:0;font-size:16px}
/* footer band */
.nl-band{border-bottom:0}
.nl-wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nl-band-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 48px;align-items:center;padding-block:40px}
@media (max-width:820px){.nl-band-in{grid-template-columns:minmax(0,1fr);padding-block:40px}}
@media (max-width:480px){.nl-band .nl-row{flex-direction:column}.nl-band .nl-form button[type=submit]{width:100%}}
/* pop-up */
#nl-pop[hidden]{display:none}
#nl-pop{position:fixed;inset:0;z-index:2147483647 !important;display:flex;align-items:center;justify-content:center;padding:16px}
#nl-pop .nl-back{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
#nl-pop .nl-box{position:relative;width:100%;max-width:460px;box-sizing:border-box;background:#0f1011;border:1px solid rgba(255,255,255,.14);border-top:3px solid #009a44;border-radius:12px;padding:32px 28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.6);outline:none;animation:nlIn .25s ease-out}
#nl-pop .nl-d{margin-bottom:20px}
#nl-pop .nl-x{position:absolute;top:10px;right:10px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;cursor:pointer}
#nl-pop .nl-x svg{width:20px;height:20px;fill:none;stroke:#d0d6e0;stroke-width:2;stroke-linecap:round}
#nl-pop .nl-x:hover{background:rgba(255,255,255,.06)} #nl-pop .nl-x:focus-visible{outline:2px solid #009a44}
@keyframes nlIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  /* centred card on phones: a sheet stuck to the bottom hides behind Safari's floating bar on new iPhones (18 Nov) */
  #nl-pop{align-items:center;padding:16px 12px}
  #nl-pop .nl-box{border-radius:14px;padding:26px 16px 20px;max-height:calc(100dvh - 40px);overflow-y:auto}
  #nl-pop .nl-t{font-size:28px;padding-right:40px}
  #nl-pop .nl-d{font-size:14px;margin-bottom:16px}
  #nl-pop .nl-row{flex-direction:column} #nl-pop .nl-form button[type=submit]{width:100%}
}
@media (prefers-reduced-motion:reduce){#nl-pop .nl-box{animation:none}}
</style>
<script>
(function(){
  var URL='https://c20401b9.sibforms.com/serve/MUIFAGf8xy8acSBm_u9BQ9n_3VzjxyqK4W4RUl9mkcFN234r0wBFOQeNSuILWLJ38fNHO2xYqGsDfrLQv_D1QYffNpNBIMxmxWvNAkTAr0EjTCD1ABdE5hXm4tzQyXVXhd59Q4nyoDMnTZPTTk4MasfKo9qzr9s3AQST2QeYZPeaZom0DGtXjwSVOcDaVO7a-dKgs6b52ZzhxBmx?isAjax=1';
  var K='cc_nl', DELAY=25000, MINSCROLL=10000, SNOOZE=30*864e5;
  function get(){try{return JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){return {};}}
  function set(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
  var pop=document.getElementById('nl-pop'), lastFocus=null, timer=null;

  /* forms (footer + pop-up) */
  document.querySelectorAll('form.nl-form').forEach(function(f){
    var em=f.querySelector('input[type=email]'), msg=f.querySelector('.nl-msg'), btn=f.querySelector('button[type=submit]');
    em.addEventListener('input',function(){em.removeAttribute('aria-invalid');if(msg.classList.contains('err')){msg.textContent='';msg.className='nl-msg';}});
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var v=em.value.trim();
      if(!v||!em.checkValidity()){em.setAttribute('aria-invalid','true');msg.className='nl-msg err';msg.textContent='Please enter a valid email address.';em.focus();return;}
      if(f.querySelector('[name=email_address_check]').value){return;}
      var fd=new FormData();fd.append('EMAIL',v);fd.append('email_address_check','');fd.append('locale','en');
      btn.disabled=true;btn.textContent='Sending…';
      fetch(URL,{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
        if(!d||!d.success){throw new Error('fail');}
        f.classList.add('done');msg.className='nl-msg ok';msg.textContent='Thanks, you’re subscribed! Watch your inbox for our next update.';
        set({s:1});
        try{if(typeof gtag==='function'){gtag('event','sign_up',{method:'newsletter'});}if(window.fbq){fbq('track','Lead');}}catch(x){}
        if(pop&&!pop.hidden&&pop.contains(f)){setTimeout(close,3500);}
      }).catch(function(){
        msg.className='nl-msg err';msg.textContent='Sorry, that didn’t work. Please try again.';
      }).then(function(){btn.disabled=false;btn.textContent='Subscribe';});
    });
  });

  /* pop-up */
  if(!pop){return;}
  function open(){
    lastFocus=document.activeElement;pop.hidden=false;
    pop.querySelector('.nl-box').focus({preventScroll:true});
    document.addEventListener('keydown',onKey);
  }
  function close(){
    if(pop.hidden){return;}
    pop.hidden=true;document.removeEventListener('keydown',onKey);
    var st=get();if(!st.s){set({c:Date.now()});}
    if(lastFocus&&lastFocus.focus){try{lastFocus.focus({preventScroll:true});}catch(e){}}
  }
  function onKey(e){
    if(e.key==='Escape'){close();return;}
    if(e.key==='Tab'){
      var els=[].slice.call(pop.querySelectorAll('button,input:not(.nl-hp),a[href]')).filter(function(x){return x.offsetParent!==null;});
      if(!els.length){return;}
      var a=els[0],z=els[els.length-1];
      if(e.shiftKey&&(document.activeElement===a||document.activeElement===pop.querySelector('.nl-box'))){e.preventDefault();z.focus();}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
    }
  }
  pop.querySelectorAll('[data-nl-close]').forEach(function(b){b.addEventListener('click',close);});

  var st=get();
  if(st.s){return;}
  if(st.c&&Date.now()-st.c<SNOOZE){return;}
  if(/^\/contact\/?$/.test(location.pathname)){return;}
  var t0;try{t0=+sessionStorage.getItem('cc_nl_t0');if(!t0){t0=Date.now();sessionStorage.setItem('cc_nl_t0',t0);}}catch(e){t0=Date.now();}
  var halfway=false;
  window.addEventListener('scroll',function(){
    var h=document.documentElement.scrollHeight-innerHeight;
    if(h>0&&scrollY/h>=0.5){halfway=true;}
  },{passive:true});
  function ready(){
    var c=null;try{c=localStorage.getItem('cc_consent');}catch(e){c='x';}
    if(!c){return false;}
    var b=document.getElementById('cc-consent');if(b&&!b.hidden){return false;}
    var xp=document.getElementById('xpop');if(xp&&!xp.hidden){return false;}
    var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){return false;}
    return true;
  }
  timer=setInterval(function(){
    var t=Date.now()-t0;
    if((t>=DELAY||(halfway&&t>=MINSCROLL))&&ready()){clearInterval(timer);open();}
  },1000);
})();
</script>
