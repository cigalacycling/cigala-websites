<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#08090a}
.c{position:relative;width:1200px;height:630px;font-family:Montserrat,sans-serif;color:#d0d6e0}
.ph{position:absolute;inset:0 0 0 300px;background:url(PHOTO) PHPOS/cover no-repeat}

.sub{margin-top:20px;font-size:22px;line-height:1.4;color:#d0d6e0;max-width:600px}

<div class="url">cigalacycling.com</div>
