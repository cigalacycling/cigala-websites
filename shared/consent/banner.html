  </div>
</div>
<style>
#cc-consent{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0f1011;border-top:1px solid rgba(255,255,255,.14);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font:14px/1.5 Montserrat,system-ui,sans-serif;color:#d0d6e0}

#cc-consent .cc-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
#cc-consent p{margin:0;max-width:80ch} #cc-consent a{color:#f7f8f8;text-underline-offset:3px}
#cc-consent .cc-btns{display:flex;gap:10px}
#cc-consent button{font:600 14px Montserrat,system-ui,sans-serif;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid rgba(255,255,255,.14);background:transparent;color:#f7f8f8}
#cc-consent .cc-accept{background:#009a44;border-color:#009a44;color:#fff} #cc-consent .cc-accept:hover{background:#00b350}
#cc-consent button:focus-visible{outline:2px solid #009a44;outline-offset:2px}
#cc-chat{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9998;display:inline-flex;align-items:center;gap:8px;background:#009a44;color:#fff;border:0;border-radius:999px;padding:12px 18px;font:600 14px Montserrat,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#cc-chat[hidden]{display:none} #cc-chat:hover{background:#00b350} #cc-chat svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
#cc-chat:focus-visible{outline:2px solid #fff;outline-offset:2px}
body.cc-banner-open #cc-chat{bottom:calc(var(--cc-bh,80px) + 14px)}
</style>
<script>
